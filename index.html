<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Chutiammiii ❤️</title>
  <style>
    :root {
      --bg-1: #070507;
      --bg-2: #12080d;
      --bg-3: #1a0b12;
      --burgundy: #5d0a1a;
      --wine: #8a1233;
      --rose: #d96a8b;
      --rose-soft: #f5c6d5;
      --gold: #f4d399;
      --white: #f7edf1;
      --gray: #d7c3ca;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(138, 18, 51, 0.35), transparent 30%),
        radial-gradient(circle at bottom, rgba(93, 10, 26, 0.28), transparent 35%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 35%, var(--bg-3));
      color: var(--white);
      font-family: "Georgia", "Times New Roman", serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
      position: relative;
    }

    .floating-hearts, .floating-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: rgba(217, 106, 139, 0.7);
      font-size: 18px;
      animation: drift linear infinite;
      text-shadow: 0 0 10px rgba(217, 106, 139, 0.7);
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      animation: twinkle linear infinite;
    }

    @keyframes drift {
      0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(450px, 100%);
      background: rgba(17, 10, 15, 0.85);
      border: 1px solid rgba(217, 106, 139, 0.3);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(138, 18, 51, 0.25);
      border-radius: 24px;
      padding: 30px 20px;
      backdrop-filter: blur(10px);
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid rgba(244, 211, 153, 0.4);
      border-radius: 999px;
      background: rgba(93, 10, 26, 0.3);
      color: var(--gold);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-bottom: 15px;
    }

    .photo-container {
      width: 100%;
      height: 280px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid rgba(217, 106, 139, 0.4);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      font-size: 1.6rem;
      margin: 0 0 12px;
      color: var(--white);
      letter-spacing: 0.03em;
    }

    p {
      font-size: 1.02rem;
      line-height: 1.7;
      color: var(--gray);
      margin-bottom: 25px;
      min-height: 70px;
    }

    p strong {
      color: var(--rose-soft);
    }

    .btn-container {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      font-size: 0.95rem;
      background: var(--wine);
      color: var(--white);
      border: 1px solid rgba(217, 106, 139, 0.5);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    button:hover {
      background: var(--burgundy);
      transform: scale(1.03);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="floating-stars" id="stars"></div>
  <div class="floating-hearts" id="hearts"></div>

  <div class="card" id="cardBox">
    <div class="tag" id="tagText">Our Memory Lane</div>
    <div class="photo-container">
      <img id="storyImage" src="1.jpeg" alt="Memory">
    </div>
    <h1 id="title">Happy Birthday Chutiammiii ❤️</h1>
    <p id="storyText">Loading memories...</p>
    
    <div class="btn-container">
      <button id="prevBtn" class="secondary" style="display:none;" onclick="prevStep()">Back</button>
      <button id="nextBtn" onclick="nextStep()">Next 💫</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const steps = [
      {
        tag: "Memory 01",
        image: "1.jpeg", // ඔයාගේ පළමු ෆොටෝ එකේ නම (උදා: photo1.jpeg නම් මෙතනට ඒ නම දෙන්න)
        title: "Pure Elegance ✨",
        text: "Like a flower blooming in quiet grace, your smile and charm light up my entire world. So lucky to call you mine. 💛"
      },
      {
        tag: "Memory 02",
        image: "2.jpeg", // දෙවන ෆොටෝ එකේ නම
        title: "Holding Hands Forever 🤝",
        text: "Every moment holding your hand feels like pure magic. I promise to walk beside you through every path in life. 🌸"
      },
      {
        tag: "Memory 03",
        image: "3.jpeg", // තුන්වන ෆොටෝ එකේ නම
        title: "My Favorite Smile 😊",
        text: "The way you look at me makes time stand still. You are my peace, my happiness, and my favorite person. 💕"
      },
      {
        tag: "Memory 04",
        image: "4.jpeg", // හතරවන ෆොටෝ එකේ නම
        title: "Happy Birthday Chutiammiii! 🎂🎉",
        text: "Wishing the happiest birthday to the most special girl in my universe. May all your dreams come true. I love you endlessly! 💖✨"
      }
    ];

    let currentStep = 0;

    function updateCard() {
      const tagEl = document.getElementById("tagText");
      const titleEl = document.getElementById("title");
      const textEl = document.getElementById("storyText");
      const imgEl = document.getElementById("storyImage");
      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      const cardBox = document.getElementById("cardBox");

      cardBox.style.animation = 'none';
      cardBox.offsetHeight; 
      cardBox.style.animation = 'fadeIn 0.5s ease-in-out';

      tagEl.innerText = steps[currentStep].tag;
      titleEl.innerText = steps[currentStep].title;
      textEl.innerHTML = steps[currentStep].text;
      imgEl.src = steps[currentStep].image;

      if (currentStep > 0) {
        prevBtn.style.display = "block";
      } else {
        prevBtn.style.display = "none";
      }

      if (currentStep === steps.length - 1) {
        nextBtn.innerText = "Celebrate! 🎉";
        confetti({
          particleCount: 120,
          spread: 80,
          origin: { y: 0.6 }
        });
      } else {
        nextBtn.innerText = "Next 💫";
      }
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        updateCard();
      } else {
        confetti({
          particleCount: 180,
          spread: 100,
          origin: { y: 0.5 }
        });
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        updateCard();
      }
    }

    // Initialize first step
    updateCard();

    // Background stars and hearts animation
    const stars = document.getElementById("stars");
    const hearts = document.getElementById("hearts");

    for (let i = 0; i < 50; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDuration = (Math.random() * 3 + 2) + "s";
      star.style.animationDelay = (Math.random() * 3) + "s";
      stars.appendChild(star);
    }

    for (let i = 0; i < 15; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "♥";
      heart.style.left = Math.random() * 100 + "%";
      heart.style.animationDuration = (Math.random() * 6 + 5) + "s";
      heart.style.animationDelay = (Math.random() * 4) + "s";
      hearts.appendChild(heart);
    }
  </script>
</body>
</html>
