<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Chutiammiii ❤️</title>
  <style>
    :root {
      --bg-1: #070507;
      --bg-2: #12080d;
      --bg-3: #1a0b12;
      --burgundy: #5d0a1a;
      --wine: #8a1233;
      --rose: #d96a8b;
      --rose-soft: #f5c6d5;
      --gold: #f4d399;
      --white: #f7edf1;
      --gray: #d7c3ca;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top, rgba(138, 18, 51, 0.35), transparent 30%),
        radial-gradient(circle at bottom, rgba(93, 10, 26, 0.28), transparent 35%),
        linear-gradient(180deg, var(--bg-1), var(--bg-2) 35%, var(--bg-3));
      color: var(--white);
      font-family: "Georgia", "Times New Roman", serif;
      overflow-x: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px 15px;
      position: relative;
    }

    .floating-hearts, .floating-stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: rgba(217, 106, 139, 0.7);
      font-size: 18px;
      animation: drift linear infinite;
      text-shadow: 0 0 10px rgba(217, 106, 139, 0.7);
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      animation: twinkle linear infinite;
    }

    @keyframes drift {
      0% { transform: translateY(105vh) scale(0.8); opacity: 0; }
      15% { opacity: 1; }
      100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.1; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(450px, 100%);
      background: rgba(17, 10, 15, 0.88);
      border: 1px solid rgba(217, 106, 139, 0.3);
      box-shadow: 0 16px 50px rgba(0, 0, 0, 0.6), 0 0 40px rgba(138, 18, 51, 0.25);
      border-radius: 24px;
      padding: 30px 20px;
      backdrop-filter: blur(10px);
      text-align: center;
      animation: fadeIn 0.6s ease-in-out;
    }

    .tag {
      display: inline-block;
      padding: 6px 14px;
      border: 1px solid rgba(244, 211, 153, 0.4);
      border-radius: 999px;
      background: rgba(93, 10, 26, 0.3);
      color: var(--gold);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      font-size: 0.7rem;
      margin-bottom: 15px;
    }

    .photo-container {
      width: 100%;
      height: 270px;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 2px solid rgba(217, 106, 139, 0.4);
      box-shadow: 0 8px 25px rgba(0,0,0,0.4);
    }

    .photo-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 10px;
      color: var(--white);
      letter-spacing: 0.03em;
    }

    p {
      font-size: 0.98rem;
      line-height: 1.7;
      color: var(--gray);
      margin-bottom: 20px;
      min-height: 75px;
    }

    p strong {
      color: var(--rose-soft);
    }

    .btn-container {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-bottom: 15px;
    }

    button {
      flex: 1;
      padding: 12px 20px;
      font-size: 0.95rem;
      background: var(--wine);
      color: var(--white);
      border: 1px solid rgba(217, 106, 139, 0.5);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    button:hover {
      background: var(--burgundy);
      transform: scale(1.03);
    }

    button.secondary {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="floating-stars" id="stars"></div>
  <div class="floating-hearts" id="hearts"></div>

  <div class="card" id="cardBox">
    <div class="tag" id="tagText">Our Memory Lane</div>
    <div class="photo-container" id="imgContainer">
      <img id="storyImage" src="" alt="Memory">
    </div>
    <h1 id="title">Happy Birthday Chutiammiii ❤️</h1>
    <p id="storyText">Loading memories...</p>
    
    <div class="btn-container" id="actionButtons">
      <button id="prevBtn" class="secondary" style="display:none;" onclick="prevStep()">Back</button>
      <button id="nextBtn" onclick="nextStep()">Next 💫</button>
    </div>

    <!-- Music Player -->
    <div style="text-align: center; border-top: 1px solid rgba(217, 106, 139, 0.2); padding-top: 12px;">
      <audio id="bgMusic" loop>
        <source src="mymix.mp3" type="audio/mp3">
      </audio>
      <button onclick="toggleMusic()" id="musicBtn" style="background: rgba(217, 106, 139, 0.2); border: 1px solid rgba(217, 106, 139, 0.4); color: #f7edf1; padding: 7px 16px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; font-family: inherit; width: auto; flex: unset;">
        🎵 Play Our Song
      </button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script>
    const steps = [
      {
        tag: "Memory 01",
        image: "AE0F8FF6-FFC7-47E8-9B0A-DCD1BB75D463.jpeg",
        title: "Pure Elegance ✨",
        text: "Like a flower blooming in quiet grace, your smile and charm light up my entire world. So lucky to call you mine. 💛"
      },
      {
        tag: "Memory 02",
        image: "0951A247-1B19-43F7-8789-84BAEDE62D32.jpeg",
        title: "Holding Hands Forever 🤝",
        text: "Every moment holding your hand feels like pure magic. I promise to walk beside you through every path in life. 🌸"
      },
      {
        tag: "Memory 03",
        image: "1BD409CE-618A-47A6-B7E4-200DB8E254DF.jpeg",
        title: "My Favorite Smile 😊",
        text: "The way you look at me makes time stand still. You are my peace, my happiness, and my favorite person. 💕"
      },
      {
        tag: "Memory 04",
        image: "46D301DA-AB34-40E6-959A-1C2D99536BAE.jpeg",
        title: "Happy Birthday Chutiammiii! 🎂🎉",
        text: "Wishing the happiest birthday to the most special girl in my universe. May all your dreams come true. I love you endlessly! 💖✨",
        isQuestion: true
      }
    ];

    let currentStep = 0;

    function updateCard() {
      const tagEl = document.getElementById("tagText");
      const titleEl = document.getElementById("title");
      const textEl = document.getElementById("storyText");
      const imgContainer = document.getElementById("imgContainer");
      const btnContainer = document.getElementById("actionButtons");
      const cardBox = document.getElementById("cardBox");

      cardBox.style.animation = 'none';
      cardBox.offsetHeight; 
      cardBox.style.animation = 'fadeIn 0.5s ease-in-out';

      tagEl.innerText = steps[currentStep].tag;
      titleEl.innerText = steps[currentStep].title;
      textEl.innerHTML = steps[currentStep].text;
      imgContainer.innerHTML = `<img id="storyImage" src="${steps[currentStep].image}" alt="Memory">`;

      if (steps[currentStep].isQuestion) {
        btnContainer.innerHTML = `
          <button style="background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.2);" onclick="prevStep()">Back</button>
          <button style="background: #28a745; border-color: #34d058;" onclick="missionPassed()">Yes ❤️</button>
          <button id="noBtn" class="secondary" onmouseover="moveNo()" onclick="moveNo()">No 😜</button>
        `;
      } else {
        btnContainer.innerHTML = `
          <button id="prevBtn" class="secondary" style="${currentStep === 0 ? 'display:none;' : ''}" onclick="prevStep()">Back</button>
          <button id="nextBtn" onclick="nextStep()">Next 💫</button>
        `;
      }
    }

    function nextStep() {
      if (currentStep < steps.length - 1) {
        currentStep++;
        updateCard();
      }
    }

    function prevStep() {
      if (currentStep > 0) {
        currentStep--;
        updateCard();
      }
    }

    function moveNo() {
      const noBtn = document.getElementById('noBtn');
      const x = (Math.random() - 0.5) * 120;
      const y = (Math.random() - 0.5) * 60;
      noBtn.style.transform = `translate(${x}px, ${y}px)`;
    }

    function missionPassed() {
      confetti({
        particleCount: 250,
        spread: 120,
        origin: { y: 0.5 }
      });

      const cardBox = document.getElementById("cardBox");
      cardBox.style.animation = 'none';
      cardBox.offsetHeight;
      cardBox.style.animation = 'fadeIn 0.6s ease-in-out';

      document.getElementById("tagText").innerText = "MISSION PASSED 🎮✨";
      document.getElementById("title").innerText = "You're My Forever ❤️";
      document.getElementById("imgContainer").innerHTML = `
        <div style="padding: 20px; background: linear-gradient(135deg, rgba(93,10,26,0.4), rgba(138,18,51,0.2)); border-radius: 14px; border: 1px dashed rgba(244,211,153,0.4);">
          <div style="font-size: 2.5rem; margin-bottom: 10px;">🌟🏆💫</div>
          <div style="color: var(--gold); font-size: 1.1rem; font-weight: bold; letter-spacing: 0.08em;">HEART UNLOCKED SUCCESSFULLY</div>
        </div>
      `;
      document.getElementById("storyText").innerHTML = `
        <strong>My Dearest Chutiammiii,</strong><br><br>
        You didn't just win a game; you won my entire heart, my present, and every single tomorrow I'll ever have. 🌸<br><br>
        Thank you for being the most magical, beautiful, and irreplaceable piece of my life universe. May your 18th year bring you boundless joy, endless success, and a love that grows deeper with every heartbeat.<br><br>
        <strong>I love you more than all the stars in the sky. Happy Birthday! 🎂✨</strong>
      `;
      document.getElementById("actionButtons").innerHTML = `
        <button style="width: 100%; background: var(--wine); border-color: rgba(217,106,139,0.6);" onclick="location.reload()">Replay Memories 💫</button>
      `;
    }

    const music = document.getElementById('bgMusic');
    const musicBtn = document.getElementById('musicBtn');
    let isPlaying = false;

    function toggleMusic() {
      if (isPlaying) {
        music.pause();
        musicBtn.textContent = "🎵 Play Our Song";
        isPlaying = false;
      } else {
        music.play();
        musicBtn.textContent = "⏸️ Pause Music";
        isPlaying = true;
      }
    }

    updateCard();

    const stars = document.getElementById("stars");
    const hearts = document.getElementById("hearts");

    for (let i = 0; i < 50; i++) {
      const star = document.createElement("div");
      star.className = "star";
      star.style.left = Math.random() * 100 + "%";
      star.style.top = Math.random() * 100 + "%";
      star.style.animationDuration = (Math.random() * 3 + 2) + "s";
      star.style.animationDelay = (Math.random() * 3) + "s";
      stars.appendChild(star);
    }

    for (let i = 0; i < 15; i++) {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.textContent = "♥";
      heart.style.left = Math.random() * 100 + "%";
      heart.style.animationDuration = (Math.random() * 6 + 5) + "s";
      heart.style.animationDelay = (Math.random() * 4) + "s";
      hearts.appendChild(heart);
    }
  </script>
</body>
</html>
